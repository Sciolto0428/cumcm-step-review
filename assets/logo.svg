<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F6BBD"/>
      <stop offset="1" stop-color="#083C5F"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <!-- paper -->
  <rect x="152" y="112" width="208" height="216" rx="14" fill="#FFFFFF"/>
  <polygon points="326,112 360,112 326,146" fill="#D8E6F3"/>
  <!-- sigma (math) -->
  <polyline points="178,152 214,152 180,178 218,178" fill="none" stroke="#0F6BBD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- text lines -->
  <rect x="178" y="198" width="128" height="10" rx="5" fill="#9ECAE1"/>
  <rect x="178" y="226" width="88" height="10" rx="5" fill="#B8CDE0"/>
  <!-- checkmark (review passed) -->
  <polyline points="196,254 238,298 320,200" fill="none" stroke="#F26F21" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- steps (step-by-step) -->
  <rect x="150" y="392" width="46" height="22" rx="11" fill="#F26F21"/>
  <rect x="233" y="392" width="46" height="22" rx="11" fill="#9ECAE1"/>
  <rect x="316" y="392" width="46" height="22" rx="11" fill="#7F8C8D"/>
</svg>
